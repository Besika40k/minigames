name: Deploy to GitHub Pages

on:
  push:
    branches: [story-4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # The Firebase web app config comes from the repository variables, under
      # the names of .env.example
      - name: Build
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # GitHub Pages answers an unknown path with 404.html. As a copy of the app,
      # it opens deep links such as /minigames/library?page=2, and the app's
      # router decides what to show.
      - name: Serve the app for unknown paths
        run: cp dist/index.html dist/404.html

      # Pages serves library.html for /library, so a deep link to a page of the
      # app (the paths of src/app/url.ts) answers with status 200 instead of
      # 404, and the browser logs no failed request
      - name: Serve the app for its pages
        run: |
          cp dist/index.html dist/home.html
          cp dist/index.html dist/library.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
